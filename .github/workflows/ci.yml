name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test, Check & Coverage
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18, 20, 22]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build all targets
        run: npm run build

      - name: Verify build outputs
        run: node verify-full.mjs
      
      - name: Run test suite with coverage
        run: npm run test:coverage
      
      - name: Upload coverage reports to Codecov
        if: matrix.node-version == 22
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests
          name: chaincss-coverage
      
      - name: Run accessibility contrast audit
        run: npm run audit:contrast

      - name: Run structural engine benchmarks
        if: matrix.node-version == 22
        run: npm run bench:check

  lint:
    name: Code Quality & Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - name: Build all targets
        run: npm run build
      - name: Check code formatting
        run: npx prettier --check "src/**/*.ts"
      - name: Assert zero circular module trends
        run: npx madge --circular src/index.ts
      - name: Validate public export schemas
        run: npx publint --strict